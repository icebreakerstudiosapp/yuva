<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuva</title>
<meta name="description" content="Yuva: focus to keep them safe. A phone-time budget app where a little animal waits for you.">
<style>
  :root { --bg:#141b33; --card:#1f2a4a; --text:#eef0f8; --sub:#9aa3c4; --warm:#f4a259; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         padding:32px 20px; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; text-align:center; }
  h1 { font-size:2.4rem; margin:0 0 8px; letter-spacing:.5px; }
  p.tag { color:var(--sub); font-size:1.05rem; margin:0 0 28px; max-width:34ch; line-height:1.5; }
  a.btn { display:inline-block; background:var(--warm); color:#2a1a08; font-weight:800; text-decoration:none;
          padding:14px 28px; border-radius:999px; font-size:1rem; }
  a.btn[hidden] { display:none; }
  .soon { background:var(--card); color:var(--sub); padding:12px 22px; border-radius:999px; font-weight:700; }
  .soon[hidden] { display:none; }
  footer { margin-top:36px; font-size:.9rem; }
  footer a { color:var(--sub); margin:0 10px; }
  a:focus-visible { outline:2px solid var(--warm); outline-offset:3px; }
</style>
</head>
<body>
  <h1>Yuva</h1>
  <p class="tag">Focus to keep them safe. Keep your daily phone budget, and a little friend waits for you by the fire.</p>

  <a id="play" class="btn" href="https://play.google.com/store/apps/details?id=com.yuva.android" hidden>Get it on Google Play</a>
  <span id="soon" class="soon">Coming soon to Google Play</span>

  <footer>
    <a href="privacy.html">Privacy Policy</a>
  </footer>

<script>
  // Uygulama Play'de yayınlanınca LIVE = true yapın: Android'de mağazaya yönlendirir,
  // diğer cihazlarda "Google Play'de edinin" düğmesini gösterir.
  var LIVE = false;
  var PLAY_URL = "https://play.google.com/store/apps/details?id=com.yuva.android";
  if (LIVE) {
    document.getElementById("soon").hidden = true;
    document.getElementById("play").hidden = false;
    if (/android/i.test(navigator.userAgent)) { window.location.replace(PLAY_URL); }
  }
</script>
</body>
</html>
